# Nightly pg_dump of the app database AND the feedback board's `fider`
# database, shipped to the Hetzner Object Storage bucket under backups/.
# Restore (app): download the dump, then
#   kubectl -n playwithpro exec -i deploy/postgres -- pg_restore -U playwithpro \
#     -d playwithpro --clean --if-exists < playwithpro-<date>.pgdump
# Restore (board): scale deploy/fider to 0, then
#   kubectl -n playwithpro exec -i deploy/postgres -- pg_restore -U playwithpro \
#     -d fider --clean --if-exists --no-owner --role=fider < fider-<date>.pgdump
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: playwithpro
spec:
  schedule: "17 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          initContainers:
            - name: dump
              image: postgres:17-alpine
              command:
                - sh
                - -c
                - |
                  set -e
                  pg_dump -Fc -h postgres -U "$POSTGRES_USER" "$POSTGRES_DB" -f "/backup/playwithpro-$(date +%F).pgdump"
                  # The board's database is dumped by the superuser too; a
                  # missing database (board not deployed yet) is not an error.
                  if psql -h postgres -U "$POSTGRES_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='fider'" | grep -q 1; then
                    pg_dump -Fc -h postgres -U "$POSTGRES_USER" fider -f "/backup/fider-$(date +%F).pgdump"
                  fi
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef: { name: playwithpro-env, key: POSTGRES_USER }
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef: { name: playwithpro-env, key: POSTGRES_DB }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: playwithpro-env, key: POSTGRES_PASSWORD }
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: amazon/aws-cli:latest
              command:
                - sh
                - -c
                - aws s3 cp /backup/ "s3://$S3_BUCKET/backups/" --recursive --endpoint-url "$S3_ENDPOINT"
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: { name: playwithpro-env, key: S3_ACCESS_KEY }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: { name: playwithpro-env, key: S3_SECRET_KEY }
                - name: AWS_DEFAULT_REGION
                  valueFrom:
                    secretKeyRef: { name: playwithpro-env, key: S3_REGION }
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef: { name: playwithpro-env, key: S3_BUCKET }
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef: { name: playwithpro-env, key: S3_ENDPOINT }
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              emptyDir: {}
