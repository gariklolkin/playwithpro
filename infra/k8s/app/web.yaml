apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: playwithpro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: playwithpro/web:__TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: playwithpro-env
          env:
            # the shared secret carries the api's PORT=4000 — pin web back
            - { name: PORT, value: "3000" }
            - { name: HOSTNAME, value: "0.0.0.0" }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: playwithpro
spec:
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
