# One-shot, idempotent: creates the `fider` role and database in the existing
# Postgres and makes sure that role can never reach the application database.
# Runs as the Postgres superuser from playwithpro-env; the role password comes
# from fider-env (FIDER_DB_PASSWORD, see apply-secrets.sh). Re-runnable.
#
#   kubectl -n playwithpro delete job fider-init-db --ignore-not-found
#   kubectl -n playwithpro apply -f infra/k8s/fider/init-db-job.yaml
#   kubectl -n playwithpro wait --for=condition=complete job/fider-init-db --timeout=120s
apiVersion: batch/v1
kind: Job
metadata:
  name: fider-init-db
  namespace: playwithpro
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: init
          image: postgres:17-alpine
          command:
            - sh
            - -ec
            - |
              export PGHOST=postgres PGUSER="$POSTGRES_USER" PGPASSWORD="$POSTGRES_PASSWORD"
              # Role (password kept in sync with the Secret on every run).
              if psql -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='fider'" | grep -q 1; then
                psql -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE fider WITH LOGIN PASSWORD '$FIDER_DB_PASSWORD'"
              else
                psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE fider WITH LOGIN PASSWORD '$FIDER_DB_PASSWORD'"
              fi
              # Database owned by the role; Fider runs its own migrations on start.
              if ! psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='fider'" | grep -q 1; then
                psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE fider OWNER fider"
              fi
              # Isolation: the board's role must never reach the app database.
              # The app role owns "$POSTGRES_DB", so it keeps its own access.
              psql -d postgres -v ON_ERROR_STOP=1 \
                -c "REVOKE CONNECT ON DATABASE \"$POSTGRES_DB\" FROM PUBLIC" \
                -c "REVOKE CONNECT ON DATABASE \"$POSTGRES_DB\" FROM fider"
              echo "fider role + database ready; connect to $POSTGRES_DB revoked"
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: playwithpro-env, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: playwithpro-env, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: playwithpro-env, key: POSTGRES_DB }
            - name: FIDER_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: fider-env, key: FIDER_DB_PASSWORD }
